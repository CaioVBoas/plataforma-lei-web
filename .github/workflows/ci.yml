name: CI - Plataforma LEI Web

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate-and-build:
    name: Lint, Typecheck & Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run TypeScript typecheck & Vite build
        run: npm run build

      - name: Validate Docker image build
        run: docker build -t plataforma-lei-web:ci .
