server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Suporta upload de avatares, logos e capas em Data URL (limite 5MB na API)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Endpoint de healthcheck do container web
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Reverse proxy para o container da API na rede Docker (plataforma_lei_net)
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_api http://plataforma_lei_api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache longo para assets estáticos com hash do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback para roteamento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
